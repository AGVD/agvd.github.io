<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Личный Плеер</title>
    <style>
        body { background-color: #141414; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; }
        .section { background: #222; padding: 20px; margin-bottom: 30px; border-radius: 12px; border: 1px solid #333; }
        .input-group { margin-bottom: 15px; }
        input { width: 70%; padding: 10px; background: #333; border: 1px solid #555; color: #fff; border-radius: 6px; font-size: 14px; }
        button { padding: 10px 20px; background: #E50914; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        button:hover { background: #b80710; }
        .player-box { width: 100%; height: 480px; background: #000; margin-top: 15px; border-radius: 8px; overflow: hidden; }
        iframe, video { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Универсальный HTML-Плеер</h1>

        <!-- СЕКЦИЯ ДЛЯ YOUTUBE -->
        <div class="section">
            <h3>1. Плеер для YouTube</h3>
            <p>Вставьте полную ссылку на видео YouTube (например: <i>https://youtube.com</i>)</p>
            <div class="input-group">
                <input type="text" id="yt-url" placeholder="Вставьте ссылку на YouTube">
                <button onclick="playYouTube()">Запустить</button>
            </div>
            <div class="player-box">
                <iframe id="yt-player" src="" allowfullscreen></iframe>
            </div>
        </div>

        <!-- СЕКЦИЯ ДЛЯ ПРЯМЫХ ВИДЕОССЫЛОК -->
        <div class="section">
            <h3>2. Плеер для прямых файлов (.mp4)</h3>
            <p>Вставьте прямую ссылку на любой видеофайл из интернета, заканчивающуюся на <b>.mp4</b></p>
            <div class="input-group">
                <input type="text" id="mp4-url" placeholder="https://example.com">
                <button onclick="playMP4()">Запустить</button>
            </div>
            <div class="player-box">
                <video id="mp4-player" controls></video>
            </div>
        </div>
    </div>

    <script>
        // Функция для парсинга и запуска YouTube
        function playYouTube() {
            const input = document.getElementById('yt-url').value;
            let videoId = '';

            // Вырезаем ID видео из разных типов ссылок YouTube
            if (input.includes('v=')) {
                videoId = input.split('v=')[1].split('&')[0];
            } else if (input.includes('youtu.be/')) {
                videoId = input.split('youtu.be/')[1].split('?')[0];
            } else if (input.includes('embed/')) {
                videoId = input.split('embed/')[1].split('?')[0];
            } else {
                videoId = input; // Если ввели сразу ID
            }

            if (videoId) {
                document.getElementById('yt-player').src = `https://youtube.com{videoId}`;
            } else {
                alert('Неверная ссылка YouTube');
            }
        }

        // Функция для запуска прямого MP4 файла
        function playMP4() {
            const url = document.getElementById('mp4-url').value;
            const player = document.getElementById('mp4-player');
            if (url) {
                player.src = url;
                player.load();
                player.play().catch(e => console.log("Автозапуск заблокирован браузером, нажмите Play вручную"));
            } else {
                alert('Вставьте ссылку на файл');
            }
        }
    </script>

</body>
</html>
