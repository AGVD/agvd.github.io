<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <center style="background-color: #0b111e; color: white;">KinoDivBox Mirror</center>
    <title>Mirror Kinodivbox</title>
    <style>
        
        html, body {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%;
            background-color: #000; 
            overflow: hidden;
        }
        
        
        #player-root {
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%; 
            height: 100%; 
            border: none;
            display: block; /
        }
        
        .error-msg {
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="player-root"></div>

    <script>
        
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

       
        const kinopoiskId = getQueryParam('id');
        const container = document.getElementById('player-root');

        if (kinopoiskId) {
            
            container.innerHTML = '<iframe src="https://kinodivbox.github.io/iframe?id=' + kinopoiskId + '" allowfullscreen></iframe>';
        } else {
           
            container.innerHTML = '<div class="error-msg"><h2>Ошибка: Не указан ID фильма! ид  фильма можно узнать на https://kinopoisk.ru</h2><p>Используйте ссылку в формате: <b>https://agvd.github.io/?id=435</b></p></div>';

        }
    </script>

</body>
</html>
