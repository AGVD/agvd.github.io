<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Эмбед Плеер</title>
    <style>
        /* Устанавливаем ровно 100% экрана, чтобы плеер не ломал верстку */
        html, body {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%;
            background-color: #000; 
            overflow: hidden;
        }
        
        /* Главное исправление: заставляем корневой контейнер занимать 100% высоты экрана */
        #player-root {
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%; 
            height: 100%; 
            border: none;
            display: block; /* Убирает лишние микро-отступы снизу фрейма */
        }
        
        .error-msg {
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="player-root"></div>

    <script>
        // 1. Считываем "id" из вашей адресной строки
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // 2. Записываем полученный ID в переменную
        const kinopoiskId = getQueryParam('id');
        const container = document.getElementById('player-root');

        if (kinopoiskId) {
            // Классическая склейка строк через плюс (+).
            // Браузер возьмет ваш ID и автоматически подставит его в плеер KinoDivBox
            container.innerHTML = '<iframe src="https://kinodivbox.github.io/iframe?id=' + kinopoiskId + '" allowfullscreen></iframe>';
        } else {
            // Если ввели просто agvd.github.io без параметров
            container.innerHTML = '<div class="error-msg"><h2>Ошибка: Не указан ID фильма!</h2><p>Используйте ссылку в формате: <b>agvd.github.io/?id=258687</b></p></div>';
        }
    </script>

</body>
</html>
