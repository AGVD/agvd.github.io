<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Плеер</title>
    <!-- Обновленный рабочий адрес скрипта -->
    <script src="https://kinobox.tv/kinobox.js"></script>
    <style>
        body { background-color: #141414; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        #player { max-width: 850px; height: 480px; margin: 30px auto; background: #000; border-radius: 12px; border: 1px solid #333; }
    </style>
</head>
<body>

    <h2>Личный онлайн-кинотеатр</h2>
    <div id="player"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const kpId = urlParams.get('kp') || '251568'; // По умолчанию Дневник Памяти

        // Инициализация через стандартный вызов kinobox
        kinobox('#player', {
            search: { kinopoisk: kpId }
        });
    </script>

</body>
</html>
