<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Личный Кинотеатр</title>
    <!-- Подключаем стили и скрипт агрегатора Kinobox -->
    <script src="https://kinobox.tv"></script>
    <style>
        body { background-color: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        #player { max-width: 800px; height: 450px; margin: 20px auto; background: #000; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>

    <h1>Онлайн Плеер</h1>
    
    <!-- Контейнер, куда скрипт вставит плеер -->
    <div id="player"></div>

    <script>
        // Получаем ID фильма из адреса страницы (например: ://mysite.com)
        const urlParams = new URLSearchParams(window.location.search);
        const kpId = urlParams.get('kp') || '251568'; // Если ID не задан, включится "Дневник памяти"

        // Инициализируем плеер и подключаем балансеры
        kinoBox('#player', {
            search: { kinopoisk: kpId },
            players: {
                // Здесь можно включить или выключить нужные балансеры (true / false)
                alloha: true,
                videocdn: true,
                collaps: true,
                cdnmovies: true,
                kodik: true,
                bazon: false
            }
        });
    </script>

</body>
</html>
