
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Kinodivbox</title>
    <style>
        html, body {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%;
            background-color: #000; 
            overflow: hidden;
            display: flex;
            flex-direction: column; 
        }

        /* Шапка сайта */
        .header-panel {
            background-color: #0b111e; 
            color: white; 
            padding: 10px; 
            text-align: center; 
            font-family: sans-serif;
        }
        .mirror-title {
            background-color: #0b111e; 
            color: white;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding-top: 5px;
        }

        /* Контейнер-маска плеера */
        #player-root {
            width: 100%;
            flex-grow: 1;
            position: relative;
            overflow: hidden; /* Обрезает всё, что выходит за рамки контейнера */
        }

        /* Идеальное скрытие нижней плашки при любых размерах окна */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            /* Высчитываем высоту: 100% от контейнера + 25px, которые уйдут вниз за экран */
            height: calc(100% + 25px); 
            border: none;
            display: block; 
        }
        
        .error-msg {
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
        }
    </style>
</head>
<body>

    <h3 class="mirror-title">KinoDivBox Mirror</h3>
    <div class="header-panel">
        <span style="margin-right: 10px; font-weight: bold;">Movie ID:</span>
        <input type="number" id="idInput" placeholder="Введите ID фильма" style="padding: 5px; border-radius: 4px; border: 1px solid #334155; background-color: #1e293b; color: white; width: 140px;">
        <button onclick="goToId()" style="padding: 5px 12px; margin-left: 5px; border-radius: 4px; border: none; background-color: #3b82f6; color: white; cursor: pointer; font-weight: bold;">Открыть</button>
    </div>

    <div id="player-root"></div>

    <script>
        function goToId() {
            const inputVal = document.getElementById('idInput').value;
            if (inputVal) {
                window.location.href = window.location.origin + window.location.pathname + "?id=" + inputVal;
            } else {
                alert("Пожалуйста, введите ID фильма!");
            }
        }

        document.getElementById('idInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                goToId();
            }
        });

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const kinopoiskId = getQueryParam('id');
        const container = document.getElementById('player-root');

        if (kinopoiskId) {
             container.innerHTML = '<iframe src="https://kinodivbox.github.io/iframe?id=' + kinopoiskId + '" allowfullscreen></iframe>';
            document.getElementById('idInput').value = kinopoiskId;
        } else {
            container.innerHTML = '<div class="error-msg"><h2>Ошибка: Не указан ID фильма!</h2><p>Введите Кинопоиск ID в поле выше или используйте ссылку в формате: <b>agvd.github.io/?id=258687</b></p></div>';
        }
    </script>

</body>
</html>
