<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Торрент Плеер на GitHub Pages</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #00adb5;
            margin-bottom: 10px;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 20px;
        }
        /* Стилизация контейнера плеера */
        .video-wrapper {
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <h1>Онлайн Торрент Стриминг</h1>
    <p>Видео воспроизводится напрямую из торрента без установки клиента</p>

    <div class="video-wrapper">
        <!-- 
          Тег <video> с атрибутом controls и ссылкой в src.
          SDK автоматически превратит его в плеер Webtor.
        -->
        <video id="my-player" 
               controls 
               width="100%" 
               src="magnet:?xt=urn:btih:08ada5a7a6183aae1e09d831df6748d566095a10&dn=Sintel">
        </video>
    </div>

    <!-- Подключаем официальный скрипт из репозитория embed-sdk-js -->
    <script src="https://jsdelivr.net" charset="utf-8" async></script>

</body>
</html>
