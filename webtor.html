<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Торрент Плеер на GitHub Pages</title>
    
    <!-- Подключаем официальный Webtor Embed SDK -->
    <script src="https://jsdelivr.net" charset="utf-8"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #00adb5;
            margin-bottom: 10px;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 20px;
        }
        /* Контейнер для адаптивности плеера */
        .player-container {
            width: 100%;
            max-width: 800px;
            height: 450px;
            background-color: #000000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <h1>Онлайн Торрент Стриминг</h1>
    <p>Видео воспроизводится напрямую из торрента без установки клиента</p>

    <!-- Контейнер, куда Webtor встроит плеер -->
    <div id="player" class="player-container"></div>

    <script>
        // Инициализация Webtor SDK
        window.webtor = window.webtor || [];
        window.webtor.push({
            id: 'player', // ID контейнера выше
            // Вставьте сюда вашу magnet-ссылку:
            magnet: 'magnet:?xt=urn:btih:08ada5a7a6183aae1e09d831df6748d566095a10&dn=Sintel',
            theme: 'dark', // Тема оформления плеера
            onReady: function(e) {
                console.log('Плеер Webtor успешно запущен:', e);
            },
            onError: function(e) {
                console.error('Ошибка инициализации Webtor:', e);
            }
        });
    </script>

</body>
</html>
